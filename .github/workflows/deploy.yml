name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ develop, main ] # 推送到這些分支時自動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: 1bit-forge-front # 指定前端目錄
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 1bit-forge-front/dist # 上傳打包好的 dist 目錄

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4